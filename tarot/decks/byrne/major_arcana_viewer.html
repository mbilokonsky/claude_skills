<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byrne Journey Tarot - Major Arcana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 0.5em;
            color: #f0f0f0;
        }

        .subtitle {
            font-size: 1.2em;
            color: #a0a0a0;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card-item {
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }

        .card-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
        }

        .card-image {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 2/3;
            object-fit: cover;
        }

        .card-title {
            padding: 15px;
            text-align: center;
        }

        .card-number {
            font-size: 0.9em;
            color: #888;
            font-weight: 600;
        }

        .card-name {
            font-size: 1.1em;
            margin-top: 5px;
            color: #f0f0f0;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .modal-content {
            background: #2a2a2a;
            border-radius: 12px;
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            position: relative;
        }

        .modal-left {
            flex: 0 0 400px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .modal-card-image {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .modal-right {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            max-height: 80vh;
        }

        .modal-header {
            margin-bottom: 30px;
        }

        .modal-number {
            font-size: 0.9em;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-title {
            font-size: 2em;
            color: #f0f0f0;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .modal-description {
            font-size: 1.1em;
            color: #b0b0b0;
            font-style: italic;
        }

        .modal-section {
            margin-top: 30px;
        }

        .modal-section h3 {
            font-size: 1.3em;
            color: #f0f0f0;
            margin-bottom: 12px;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
        }

        .modal-section p {
            color: #d0d0d0;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .meaning-box {
            background: #1a1a1a;
            border-left: 4px solid #4a9eff;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .meaning-box.inverted {
            border-left-color: #ff6b6b;
        }

        .meaning-box h4 {
            color: #f0f0f0;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            transition: color 0.3s;
            line-height: 1;
            z-index: 10;
        }

        .close:hover {
            color: #f0f0f0;
        }

        .visual-guidance {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .visual-guidance h4 {
            color: #4a9eff;
            margin-bottom: 10px;
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .visual-guidance p {
            color: #c0c0c0;
            font-size: 0.95em;
        }

        @media (max-width: 900px) {
            .modal-content {
                flex-direction: column;
            }

            .modal-left {
                flex: 0 0 auto;
                padding: 30px;
            }

            .modal-right {
                max-height: none;
            }
        }

        @media (max-width: 600px) {
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .modal-title {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>The Byrne Journey Tarot</h1>
        <p class="subtitle">Major Arcana • Click any card to explore</p>
    </div>

    <div class="card-grid" id="cardGrid"></div>

    <!-- Modal -->
    <div id="cardModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-left">
                <img id="modalCardImage" class="modal-card-image" src="" alt="">
            </div>
            <div class="modal-right">
                <div class="modal-header">
                    <div class="modal-number" id="modalNumber"></div>
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <p class="modal-description" id="modalDescription"></p>
                </div>

                <div class="modal-section">
                    <h3>Meanings</h3>
                    <div class="meaning-box">
                        <h4>Upright</h4>
                        <p id="modalUpright"></p>
                    </div>
                    <div class="meaning-box inverted">
                        <h4>Inverted / Shadow</h4>
                        <p id="modalInverted"></p>
                    </div>
                </div>

                <div class="modal-section">
                    <h3>Visual Elements</h3>
                    <div class="visual-guidance">
                        <h4>Style Guidance</h4>
                        <p id="modalStyleGuidance"></p>
                    </div>
                    <div class="visual-guidance">
                        <h4>Content Guidance</h4>
                        <p id="modalContentGuidance"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load deck data
        let deckData = null;

        async function loadDeckData() {
            try {
                const response = await fetch('byrne-journey-tarot.json');
                deckData = await response.json();
                renderCards();
            } catch (error) {
                console.error('Error loading deck data:', error);
                document.getElementById('cardGrid').innerHTML =
                    '<p style="color: #ff6b6b; text-align: center; grid-column: 1 / -1;">Error loading deck data. Please ensure byrne-journey-tarot.json is in the same directory.</p>';
            }
        }

        function renderCards() {
            if (!deckData) return;

            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            // Render all 22 Major Arcana cards (0-21)
            for (let i = 0; i <= 21; i++) {
                const cardKey = `major-${i}`;
                const cardData = deckData.cards[cardKey];

                if (!cardData) continue;

                const cardItem = document.createElement('div');
                cardItem.className = 'card-item';
                cardItem.onclick = () => openModal(i, cardData);

                const cardImage = document.createElement('img');
                cardImage.className = 'card-image';
                cardImage.src = `cards/major-${String(i).padStart(2, '0')}.png`;
                cardImage.alt = cardData.name;
                cardImage.loading = 'lazy';

                const cardTitle = document.createElement('div');
                cardTitle.className = 'card-title';

                const cardNumber = document.createElement('div');
                cardNumber.className = 'card-number';
                cardNumber.textContent = `Card ${i}`;

                const cardName = document.createElement('div');
                cardName.className = 'card-name';
                cardName.textContent = cardData.name;

                cardTitle.appendChild(cardNumber);
                cardTitle.appendChild(cardName);
                cardItem.appendChild(cardImage);
                cardItem.appendChild(cardTitle);
                grid.appendChild(cardItem);
            }
        }

        function openModal(cardNumber, cardData) {
            const modal = document.getElementById('cardModal');

            // Set image
            document.getElementById('modalCardImage').src =
                `cards/major-${String(cardNumber).padStart(2, '0')}.png`;

            // Set header info
            document.getElementById('modalNumber').textContent = `Major Arcana ${cardNumber}`;
            document.getElementById('modalTitle').textContent = cardData.name;
            document.getElementById('modalDescription').textContent = cardData.description;

            // Set meanings
            document.getElementById('modalUpright').textContent = cardData.meaning.upright;
            document.getElementById('modalInverted').textContent = cardData.meaning.inverted;

            // Set visual guidance
            if (cardData.visuals && cardData.visuals.instructions) {
                document.getElementById('modalStyleGuidance').textContent =
                    cardData.visuals.instructions.style_guidance || 'N/A';
                document.getElementById('modalContentGuidance').textContent =
                    cardData.visuals.instructions.content_guidance || 'N/A';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('cardModal');
            modal.classList.remove('active');
        }

        // Event listeners
        document.querySelector('.close').onclick = closeModal;

        document.getElementById('cardModal').onclick = function(event) {
            if (event.target === this) {
                closeModal();
            }
        };

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        // Load data on page load
        loadDeckData();
    </script>
</body>
</html>
